name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Validate exporter and declaration package
        run: |
          /usr/bin/swift --version
          /usr/bin/swift package resolve
          git diff --exit-code -- Package.resolved
          /usr/bin/swift format lint --strict --recursive --configuration .swift-format Package.swift Sources Tests
          /usr/bin/swift test --disable-automatic-resolution
          /usr/bin/swift build -c release --disable-automatic-resolution
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 scripts/build_package.py dist > package-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-format-plugin-${{ github.sha }}
          path: |
            dist/swift-format.zip
            package-receipt.json
          if-no-files-found: error
          retention-days: 14
  minimum-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Verify the oldest supported package interpreter
        run: |
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 scripts/build_package.py dist
  host-consumer:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Verify deterministic consumer against pinned Host source
        shell: bash
        run: |
          host_revision=$(cat .github/computer-mcp-host.sha)
          [[ "$host_revision" =~ ^[0-9a-f]{40}$ && "$host_revision" != 0000000000000000000000000000000000000000 ]]
          plugin_revision=$(git rev-parse HEAD)
          host_checkout="$RUNNER_TEMP/computer-mcp-host"
          git init "$host_checkout"
          git -C "$host_checkout" fetch --no-tags --depth=1 https://github.com/computer-mcp/computer-mcp.git "$host_revision"
          git -C "$host_checkout" checkout --detach FETCH_HEAD

          evidence=.build/host-check/deterministic
          if ! python3 -B scripts/check_host.py \
            --host-source "$host_checkout" --host-sha "$host_revision" \
            --plugin-source "$PWD" --plugin-sha "$plugin_revision" \
            --mode deterministic --timeout 1500; then
            if [[ -f "$evidence/swift-test.log" ]]; then cat "$evidence/swift-test.log"; fi
            exit 1
          fi
          cat "$evidence/receipt.json"
  validate:
    if: always()
    needs: [package, minimum-python, host-consumer]
    uses: computer-mcp/github-workflows/.github/workflows/result.yml@fd25fcface41732fda099017c6945912366fc7c1
    with:
      needs-json: ${{ toJSON(needs) }}
